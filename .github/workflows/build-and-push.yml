name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated packages to build (empty = all)'
        required: false
        default: ''
      agent_variant:
        description: 'Agent variant to build (claude or opencode). Overrides packages list.'
        required: false
        default: ''
  # Variant repo pushes trigger this via repository_dispatch.
  # The variant repo's CI sends: gh api -X POST /repos/arnonzamir/ll5/dispatches \
  #   -f event_type=rebuild-agent -f client_payload[package]=run-claude
  repository_dispatch:
    types: [rebuild-agent]
  # Weekly fallback rebuild — catches failed dispatches or stale images.
  # Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ll5

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the push diff below runs against github.event.before (the
          # previous tip), not HEAD~1 — see the comment there.
          fetch-depth: 0

      - id: set-matrix
        run: |
          # findhub-poller disabled 2026-06-03 (Find Hub locate requests were ringing devices)
          # run-claude / run-opencode: agent variants (Phase 4)
          # Variants are NOT in the default push matrix — they have their own CI in
          # their own repos. They're only built via workflow_dispatch or repository_dispatch.
          INFRA_PACKAGES=("personal-knowledge" "gtd" "awareness" "google" "messaging" "health" "gateway" "dashboard" "vault" "agent-orchestrator")
          VARIANT_PACKAGES=("run-claude" "run-opencode")
          PACKAGES=("${INFRA_PACKAGES[@]}" "${VARIANT_PACKAGES[@]}")

          # On manual dispatch with specific packages, use those
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.packages }}" ]]; then
            IFS=',' read -ra PACKAGES <<< "${{ inputs.packages }}"
          fi

          # On manual dispatch with agent_variant, build only that variant
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.agent_variant }}" ]]; then
            PACKAGES=("run-${{ inputs.agent_variant }}")
          fi

          # On repository_dispatch (a variant repo pushed), DO NOT rebuild the
          # variant image here: the variant repo's own CI already built+pushed
          # its :latest, and ll5's GITHUB_TOKEN cannot push to the variant's GHCR
          # package (403 Forbidden). Deploy-only — empty build matrix; the deploy
          # job pulls the variant's freshly-built :latest. (client_payload.package
          # is informational; the active AGENT_VARIANT selects which image runs.)
          # EXCEPT run-claude (DECISION-027): the Claude variant's production image
          # is ll5-run-claude, built HERE from docker/Dockerfile.ll5-run-claude
          # (ll5 owns that GHCR package, so the push succeeds). The variant repo is
          # a trigger, not a builder — its push dispatches package=run-claude and
          # we build + deploy + roll the running per-user agents.
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            if [[ "${{ github.event.client_payload.package }}" == "run-claude" ]]; then
              PACKAGES=("run-claude")
            else
              PACKAGES=()
            fi
          fi

          # On schedule (weekly fallback), rebuild run-claude only. run-opencode is
          # built by its own repo's CI; building it here 403s on the GHCR push
          # (permission_denied: read_package) and, with matrix fail-fast, that
          # failure CANCELLED the run-claude build every Monday from 2026-07-20 to
          # 2026-08-31 — the live claude image silently never refreshed.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            PACKAGES=("run-claude")
          fi

          # On push, check which packages changed (shared changes trigger ALL infra)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # ISS-025: diff against the PREVIOUS PUSHED TIP, not HEAD~1. A push whose
            # tip is a merge commit (or several commits) only showed the tip's
            # first-parent delta, so packages changed in the merged branch were
            # silently not rebuilt (2026-09-04: Track B's five MCP changes shipped
            # only gateway). github.event.before is the ref before this push; on a
            # force-push/new-branch it can be all zeros — fall back to HEAD~1 then.
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BASE" HEAD)
            # packages/shared/ OR packages/ll5-run-shared/ OR docker/ OR
            # scripts/render-mcp-config.ts → rebuild all infra packages
            SHARED_CHANGED=$(echo "$CHANGED" | grep -c "packages/shared/" || true)
            # packages/ll5-run-shared/ is the AGENT's content (CLAUDE.md, skills,
            # prompts) baked into ll5-run-claude by docker/Dockerfile.ll5-run-claude —
            # it must rebuild run-claude (and roll the agent), not the 10 MCPs.
            RUNSHARED_CHANGED=$(echo "$CHANGED" | grep -c "packages/ll5-run-shared/" || true)
            DOCKER_CHANGED=$(echo "$CHANGED" | grep -c "docker/" || true)
            RENDER_CHANGED=$(echo "$CHANGED" | grep -c "scripts/render-mcp-config.ts" || true)

            # Variants are never built on push — EXCEPT run-claude when its content
            # (packages/ll5-run-shared/) changed (DECISION-027: ll5 builds that image).
            PACKAGES=("${INFRA_PACKAGES[@]}")
            if [[ "$RUNSHARED_CHANGED" -gt 0 && ( "$SHARED_CHANGED" -gt 0 || "$DOCKER_CHANGED" -gt 0 || "$RENDER_CHANGED" -gt 0 ) ]]; then
              PACKAGES+=("run-claude")
            fi

            if [[ "$SHARED_CHANGED" -eq 0 && "$DOCKER_CHANGED" -eq 0 && "$RENDER_CHANGED" -eq 0 ]]; then
              FILTERED=()
              for pkg in "${PACKAGES[@]}"; do
                if echo "$CHANGED" | grep -q "packages/$pkg/"; then
                  FILTERED+=("$pkg")
                fi
              done
              if [[ "$RUNSHARED_CHANGED" -gt 0 ]]; then
                FILTERED+=("run-claude")
              fi
              if [[ ${#FILTERED[@]} -gt 0 ]]; then
                PACKAGES=("${FILTERED[@]}")
              else
                # ISS-023: a push that touches NO package (docs, workflows, root
                # files) used to fall through with the FULL infra list — every
                # docs-only commit rebuilt and redeployed all 10 services. Nothing
                # matched → build nothing → (deploy is gated on a non-empty matrix
                # for pushes, below) deploy nothing.
                PACKAGES=()
              fi
            fi
          fi

          # Build JSON matrix. When there is NOTHING to build (e.g.
          # repository_dispatch = deploy-only), emit an EMPTY string, not
          # {"package":[]}: the build job's `if: matrix != ''` then skips it
          # cleanly. A zero-entry matrix object instead makes the build job fail
          # ("matrix vector does not contain any values") and blocks deploy.
          if [[ ${#PACKAGES[@]} -eq 0 ]]; then
            echo "matrix=" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${PACKAGES[@]}" | jq -R . | jq -sc '{package: .}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi

  compose-drift-check:
    # Detects manual edits to the on-host docker-compose.yml so we catch drift
    # before the next deploy resyncs from the repo. Runs in parallel with build —
    # NOT in `needs:` for the deploy job, so failure here is visible/loud but
    # doesn't block deploy (deploy itself re-sources the repo file, which is
    # exactly the corrective action).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch on-host compose file
        id: fetch
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ vars.SERVER_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: /data/coolify/services/${{ secrets.COOLIFY_SERVICE_UUID }}/docker-compose.yml
          target: /tmp/host-compose/
          strip_components: 5

      - name: Diff host compose against repo
        run: |
          HOST_FILE="/tmp/host-compose/docker-compose.yml"
          REPO_FILE="docker/docker-compose.prod.yml"

          if [ ! -f "$HOST_FILE" ]; then
            echo "::notice::No on-host compose file found at /data/coolify/services/<uuid>/docker-compose.yml."
            echo "::notice::This is expected on a first deploy ever, or after the host service dir was wiped."
            echo "::notice::Skipping drift check — the next deploy will scp the repo file into place."
            exit 0
          fi

          # Normalize both sides before diffing:
          #   - strip trailing whitespace
          #   - drop comment-only lines (lines whose first non-whitespace char is `#`)
          #   - drop blank lines (so a stray blank-line edit doesn't trip the check)
          normalize() {
            sed -E 's/[[:space:]]+$//' "$1" \
              | grep -Ev '^[[:space:]]*#' \
              | grep -Ev '^[[:space:]]*$'
          }

          normalize "$HOST_FILE" > /tmp/host.norm
          normalize "$REPO_FILE" > /tmp/repo.norm

          if diff -q /tmp/host.norm /tmp/repo.norm > /dev/null; then
            echo "Compose files match (ignoring trailing whitespace, comments, blank lines)."
            exit 0
          fi

          echo "::error title=Compose drift detected::On-host docker-compose.yml differs from docker/docker-compose.prod.yml"
          echo ""
          echo "==================================================================="
          echo "DRIFT DETECTED: on-host compose != repo docker/docker-compose.prod.yml"
          echo "==================================================================="
          echo ""
          echo "Don't edit on-host compose. CI will overwrite it from the repo on"
          echo "next deploy anyway. If you need a hot patch, commit it to the repo"
          echo "and push — that's the only safe path."
          echo ""
          echo "Recovery procedure: see 'Recovery procedure (post-2026-05-18 outage)'"
          echo "in docs/HANDOFF.md."
          echo ""
          echo "First ~50 lines of unified diff (host -> repo):"
          echo "-------------------------------------------------------------------"
          diff -u /tmp/host.norm /tmp/repo.norm | head -n 50 || true
          echo "-------------------------------------------------------------------"
          exit 1

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.matrix != ''
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      # Always checkout ll5 repo first (build context for all packages)
      - uses: actions/checkout@v4

      # For variant packages (run-*), checkout the variant repo into
      # variant-content/ — this is the COPY source in the Dockerfile.
      # Uses VARIANT_REPO_READ_PAT (repo scope), NOT GHCR_READ_PAT (packages scope).
      - name: Checkout variant repo
        if: startsWith(matrix.package, 'run-')
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.package == 'run-opencode' && 'arnonzamir/ll5-run-opencode' || format('arnonzamir/ll5-{0}-code', matrix.package) }}
          path: variant-content
          token: ${{ secrets.VARIANT_REPO_READ_PAT }}

      # findhub-poller is Python; run-* packages are variant content (no Node
      # build needed — Dockerfile COPYs scripts/configs, render-mcp-config.ts
      # runs inside the Docker build with tsx).
      - name: Set up Node.js
        if: matrix.package != 'findhub-poller' && !startsWith(matrix.package, 'run-')
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: matrix.package != 'findhub-poller' && !startsWith(matrix.package, 'run-')
        run: npm ci

      - name: Build shared package
        if: matrix.package != 'findhub-poller' && !startsWith(matrix.package, 'run-')
        run: npm run build --workspace=packages/shared

      - name: Typecheck target package
        if: matrix.package != 'findhub-poller' && !startsWith(matrix.package, 'run-')
        run: npx tsc --noEmit --project packages/${{ matrix.package }}/tsconfig.json

      - name: Build target package
        if: matrix.package != 'findhub-poller' && !startsWith(matrix.package, 'run-')
        run: npm run build --workspace=packages/${{ matrix.package }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          case "${{ matrix.package }}" in
            gateway)
              echo "file=docker/Dockerfile.gateway" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT" ;;
            findhub-poller)
              echo "file=packages/findhub-poller/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT" ;;
            dashboard)
              echo "file=docker/Dockerfile.dashboard" >> "$GITHUB_OUTPUT"
              echo "build_args=BUILD_ID=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" ;;
            vault)
              # Own Dockerfile: Dockerfile.mcp base + the Bitwarden CLI layer (DECISION-022).
              echo "file=docker/Dockerfile.vault" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT" ;;
            agent-orchestrator)
              echo "file=docker/Dockerfile.agent-orchestrator" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT" ;;
            run-claude)
              echo "file=docker/Dockerfile.ll5-run-claude" >> "$GITHUB_OUTPUT"
              # CLAUDE_CODE_VERSION: the CLI pin (DECISION-027). Repo var overrides
              # the Dockerfile default so a bump is a deliberate, visible act.
              echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
              echo "MCP_BASE_DOMAIN=${{ vars.MCP_BASE_DOMAIN || 'noninoni.click' }}" >> "$GITHUB_OUTPUT"
              echo "CLAUDE_CODE_VERSION=${{ vars.CLAUDE_CODE_VERSION || '2.1.204' }}" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT" ;;
            run-opencode)
              echo "file=docker/Dockerfile.ll5-run-opencode" >> "$GITHUB_OUTPUT"
              echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
              echo "OPENCODE_VERSION=${{ secrets.OPENCODE_VERSION || '1.17.15' }}" >> "$GITHUB_OUTPUT"
              echo "MCP_BASE_DOMAIN=${{ vars.MCP_BASE_DOMAIN || 'noninoni.click' }}" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "file=docker/Dockerfile.mcp" >> "$GITHUB_OUTPUT"
              echo "build_args=PACKAGE_NAME=${{ matrix.package }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          build-args: ${{ steps.dockerfile.outputs.build_args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.package }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.package }}:latest
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

  deploy:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    # Run on main pushes and on repository_dispatch (variant redeploy). Must run
    # even when `build` is SKIPPED (repository_dispatch builds nothing — deploy
    # pulls the variant's already-built :latest), but NOT when build actually
    # failed. always() lets us evaluate the skipped case; guard on the results.
    # ISS-023: on a PUSH, an empty matrix means nothing changed that we deploy —
    # skip the deploy entirely (a docs-only commit must not bounce the stack).
    # repository_dispatch keeps its deploy-only semantics (empty matrix, pull
    # the variant's :latest); schedule/dispatch always built something.
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch') &&
      needs.detect-changes.result == 'success' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled' &&
      (github.event_name != 'push' || needs.detect-changes.outputs.matrix != '')
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose to server (repo is source of truth)
        # Sync docker/docker-compose.prod.yml to the host BEFORE the deploy script
        # runs. Prevents the post-2026-05-18 drift class where the on-host compose
        # diverges from repo and orphan containers accumulate.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker/docker-compose.prod.yml
          target: /data/coolify/services/${{ secrets.COOLIFY_SERVICE_UUID }}/
          strip_components: 1
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          # MUST be the non-expiring read:packages PAT, NOT secrets.GITHUB_TOKEN.
          # GITHUB_TOKEN is an ephemeral `ghs_` Actions token (1h life); writing it
          # into the host's SHARED /root/.docker/config.json clobbers the credential
          # for every other app on the box (ll5-agent/ll5-run, claude-box), so their
          # next pull after expiry fails `denied`. This was the recurring GHCR
          # outage — keep this on GHCR_READ_PAT. See HANDOFF "GHCR credential".
          GHCR_TOKEN: ${{ secrets.GHCR_READ_PAT }}
          # findhub-poller secrets. Coolify does NOT sync API-added env vars to
          # the on-host .env that `docker compose up` reads, so we inject them
          # here from GitHub secrets (idempotent upsert below).
          FINDHUB_WEBHOOK_TOKEN: ${{ secrets.FINDHUB_WEBHOOK_TOKEN }}
          FINDHUB_SECRETS_B64: ${{ secrets.FINDHUB_SECRETS_B64 }}
          FINDHUB_DEVICE_TYPES: ${{ secrets.FINDHUB_DEVICE_TYPES }}
          # ES auth: the compose interpolates ${ELASTIC_PASSWORD} into every
          # ELASTICSEARCH_URL (inline creds); Coolify env doesn't reach the on-host
          # .env, so inject it here like the FINDHUB_* secrets.
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
          # Shared secret between the gateway and the agent-orchestrator control
          # plane (per-user container provisioning). Coolify env doesn't reach the
          # on-host .env, so inject it here.
          ORCHESTRATOR_SECRET: ${{ secrets.ORCHESTRATOR_SECRET }}
          # Vault MCP machine-account secrets (DECISION-022). Same story: Coolify
          # env doesn't reach the on-host .env, so they come from GitHub secrets.
          # Values are printed by packages/vault/scripts/bootstrap.ts.
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          # WhatsApp ingest queue + dedicated in-stack Evolution (DECISION-024).
          # Same story as above: Coolify env doesn't reach the on-host .env.
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          EVOLUTION_GLOBAL_KEY: ${{ secrets.EVOLUTION_GLOBAL_KEY }}
          # ---- Agent variant (Phase 4/5) ----
          # Claude Code variant: subscription OAuth token (NOT ANTHROPIC_API_KEY).
          # The agent's entrypoint writes this to ~/.ll5/token.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # opencode variant: Zen API key for model access.
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          # Groq key for the agent's transcribe_audio tool (Zen has no speech
          # models). Coolify env doesn't reach the on-host .env — inject here.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Model selection for opencode variant (only used by triggerAgent when
          # OPENCODE_SERVER_URL is set). Default deepseek-v4-pro (Zen paid tier).
          # Set the repo var OPENCODE_MODEL_ID to override the main session's model
          # per-deployment without a code change; leave unset to inherit the default.
          OPENCODE_MODEL_ID: ${{ vars.OPENCODE_MODEL_ID || 'deepseek-v4-flash-free' }}
          OPENCODE_PROVIDER_ID: ${{ vars.OPENCODE_PROVIDER_ID || 'opencode' }}
          # Variant selection: "claude" or "opencode". Default: claude.
          AGENT_VARIANT: ${{ secrets.AGENT_VARIANT || 'claude' }}
          # What this run built (JSON matrix or empty). The deploy script rolls the
          # running per-user agents only when run-claude was rebuilt (DECISION-027).
          BUILT_MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,FINDHUB_WEBHOOK_TOKEN,FINDHUB_SECRETS_B64,FINDHUB_DEVICE_TYPES,ELASTIC_PASSWORD,ORCHESTRATOR_SECRET,BW_CLIENTID,BW_CLIENTSECRET,BW_PASSWORD,RABBITMQ_PASSWORD,EVOLUTION_GLOBAL_KEY,CLAUDE_CODE_OAUTH_TOKEN,OPENCODE_ZEN_API_KEY,GROQ_API_KEY,AGENT_VARIANT,BUILT_MATRIX
          command_timeout: 15m
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u arnonzamir --password-stdin
            cd /data/coolify/services/${{ secrets.COOLIFY_SERVICE_UUID }}
            # Move the scp'd file into place atomically (scp puts it as
            # docker-compose.prod.yml; we want docker-compose.yml).
            if [ -f docker-compose.prod.yml ]; then
              mv docker-compose.prod.yml docker-compose.yml
            fi
            # Inject findhub-poller env into .env (idempotent: strip old FINDHUB_
            # lines, re-append). Only when the token secret is present, so a
            # misconfigured run never blanks a working .env.
            if [ -n "$FINDHUB_WEBHOOK_TOKEN" ]; then
              touch .env
              grep -v '^FINDHUB_' .env > .env.findhub.tmp 2>/dev/null || true
              mv .env.findhub.tmp .env
              {
                printf 'FINDHUB_WEBHOOK_TOKEN=%s\n' "$FINDHUB_WEBHOOK_TOKEN"
                printf 'FINDHUB_SECRETS_B64=%s\n' "$FINDHUB_SECRETS_B64"
                printf "FINDHUB_DEVICE_TYPES='%s'\n" "$FINDHUB_DEVICE_TYPES"
              } >> .env
              echo "Injected FINDHUB_* into .env"
            else
              echo "WARN: FINDHUB_WEBHOOK_TOKEN secret empty — leaving .env untouched"
            fi
            # Inject vault MCP machine-account secrets (idempotent). Guard on
            # non-empty so a missing secret never blanks a working .env — the
            # compose defaults BW_* to empty, and the vault service just reports
            # itself unconfigured until they land.
            if [ -n "$BW_CLIENTID" ]; then
              touch .env
              grep -v '^BW_' .env > .env.bw.tmp 2>/dev/null || true
              mv .env.bw.tmp .env
              {
                printf 'BW_CLIENTID=%s\n' "$BW_CLIENTID"
                printf 'BW_CLIENTSECRET=%s\n' "$BW_CLIENTSECRET"
                printf 'BW_PASSWORD=%s\n' "$BW_PASSWORD"
              } >> .env
              echo "Injected BW_* into .env"
            else
              echo "WARN: BW_CLIENTID secret empty — vault MCP will run unconfigured"
            fi
            # Inject GROQ_API_KEY (idempotent) — the agent's transcribe_audio tool.
            # Guard on non-empty so a missing secret never blanks a working .env
            # (audio just stays off until the key lands).
            if [ -n "$GROQ_API_KEY" ]; then
              touch .env
              grep -v '^GROQ_API_KEY=' .env > .env.groq.tmp 2>/dev/null || true
              mv .env.groq.tmp .env
              printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> .env
              echo "Injected GROQ_API_KEY into .env"
            else
              echo "WARN: GROQ_API_KEY secret empty — audio transcription stays off"
            fi
            # Inject ELASTIC_PASSWORD (idempotent). Guard on non-empty so a missing
            # secret never blanks it and breaks every ES client.
            if [ -n "$ELASTIC_PASSWORD" ]; then
              touch .env
              grep -v '^ELASTIC_PASSWORD=' .env > .env.es.tmp 2>/dev/null || true
              mv .env.es.tmp .env
              printf 'ELASTIC_PASSWORD=%s\n' "$ELASTIC_PASSWORD" >> .env
              echo "Injected ELASTIC_PASSWORD into .env"
            else
              echo "WARN: ELASTIC_PASSWORD secret empty — leaving .env untouched"
            fi
            # Inject ORCHESTRATOR_SECRET (idempotent). Guard on non-empty so a
            # missing secret never blanks it (gateway↔orchestrator auth).
            if [ -n "$ORCHESTRATOR_SECRET" ]; then
              touch .env
              grep -v '^ORCHESTRATOR_SECRET=' .env > .env.orch.tmp 2>/dev/null || true
              mv .env.orch.tmp .env
              printf 'ORCHESTRATOR_SECRET=%s\n' "$ORCHESTRATOR_SECRET" >> .env
              echo "Injected ORCHESTRATOR_SECRET into .env"
            else
              echo "WARN: ORCHESTRATOR_SECRET secret empty — orchestrator disabled"
            fi
            # GHCR read PAT for the orchestrator's force-pull-before-provision (so
            # a per-user container never runs a stale local image). Reuses the same
            # non-expiring read:packages PAT + user the host docker login uses.
            if [ -n "$GHCR_TOKEN" ]; then
              touch .env
              grep -vE '^GHCR_PULL_(TOKEN|USER)=' .env > .env.ghcr.tmp 2>/dev/null || true
              mv .env.ghcr.tmp .env
              printf 'GHCR_PULL_TOKEN=%s\n' "$GHCR_TOKEN" >> .env
              printf 'GHCR_PULL_USER=%s\n' 'arnonzamir' >> .env
              echo "Injected GHCR_PULL_TOKEN/USER into .env"
            fi
            # Inject WhatsApp ingest queue + Evolution reconciler secrets
            # (DECISION-024, idempotent). Guard on non-empty so a missing secret
            # never blanks a working .env — both degrade safely when absent
            # (queue → inline fallback; reconciler → event-triggered only).
            if [ -n "$RABBITMQ_PASSWORD" ]; then
              touch .env
              grep -v -E '^(RABBITMQ_PASSWORD|EVOLUTION_API_KEY|EVOLUTION_GLOBAL_KEY)=' .env > .env.wa.tmp 2>/dev/null || true
              mv .env.wa.tmp .env
              {
                printf 'RABBITMQ_PASSWORD=%s\n' "$RABBITMQ_PASSWORD"
                printf 'EVOLUTION_GLOBAL_KEY=%s\n' "$EVOLUTION_GLOBAL_KEY"
              } >> .env
              echo "Injected RABBITMQ_PASSWORD + EVOLUTION_GLOBAL_KEY into .env"
            else
              echo "WARN: RABBITMQ_PASSWORD secret empty — WhatsApp queue will run without a broker (inline fallback)"
            fi

            # ===== Inject agent variant env (idempotent) — Phase 4/5 =====
            # AGENT_VARIANT: selects which agent image to run ("claude" or "opencode").
            # OPENCODE_SERVER_URL: derived from AGENT_VARIANT — NOT set independently.
            #   This makes rollback truly single-var: change AGENT_VARIANT, deploy.
            #   opencode → http://agent:4096 (gateway triggers agent via HTTP)
            #   claude   → empty (gateway uses PG NOTIFY → channel bridge flow)
            AGENT_VARIANT="${AGENT_VARIANT:-claude}"
            if [ "$AGENT_VARIANT" = "opencode" ]; then
              OPC_URL="http://agent:4096"
              OPC_MODEL="${OPENCODE_MODEL_ID:-deepseek-v4-flash-free}"
              OPC_PROVIDER="${OPENCODE_PROVIDER_ID:-opencode}"
            else
              OPC_URL=""
              OPC_MODEL=""
              OPC_PROVIDER=""
            fi
            touch .env
            grep -v -E '^(AGENT_VARIANT|OPENCODE_SERVER_URL|OPENCODE_MODEL_ID|OPENCODE_PROVIDER_ID|CLAUDE_CODE_OAUTH_TOKEN|OPENCODE_ZEN_API_KEY)=' .env > .env.agent.tmp 2>/dev/null || true
            mv .env.agent.tmp .env
            {
              printf 'AGENT_VARIANT=%s\n' "$AGENT_VARIANT"
              printf 'OPENCODE_SERVER_URL=%s\n' "$OPC_URL"
              printf 'OPENCODE_MODEL_ID=%s\n' "$OPC_MODEL"
              printf 'OPENCODE_PROVIDER_ID=%s\n' "$OPC_PROVIDER"
              printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$CLAUDE_CODE_OAUTH_TOKEN"
              printf 'OPENCODE_ZEN_API_KEY=%s\n' "$OPENCODE_ZEN_API_KEY"
            } >> .env
            echo "Injected AGENT_VARIANT=$AGENT_VARIANT OPENCODE_SERVER_URL=$OPC_URL OPENCODE_MODEL_ID=$OPC_MODEL OPENCODE_PROVIDER_ID=$OPC_PROVIDER into .env"

            # Ensure the dedicated Evolution's database exists (idempotent) before
            # its container runs prisma migrate on boot.
            docker exec postgres-${{ secrets.COOLIFY_SERVICE_UUID }} psql -U "${POSTGRES_USER:-ll5}" -d "${POSTGRES_DB:-ll5}" -tc "SELECT 1 FROM pg_database WHERE datname='evolution'" 2>/dev/null | grep -q 1 \
              || docker exec postgres-${{ secrets.COOLIFY_SERVICE_UUID }} psql -U "${POSTGRES_USER:-ll5}" -d "${POSTGRES_DB:-ll5}" -c 'CREATE DATABASE evolution OWNER '"${POSTGRES_USER:-ll5}"';' 2>/dev/null || true
            # Only pull our GHCR-built images — never databases (postgres, ES) or
            # third-party images (evolution). A new patch of postgres:16-alpine
            # would otherwise trigger a container recreate → downtime.
            # NOTE: agent-orchestrator MUST be here — it was omitted before, so
            # `compose up` kept running a stale local image (the control plane
            # never picked up code changes; e.g. multi-provider config was inert
            # until a manual recreate). Its GHCR name is ll5-agent-orchestrator.
            for img in gateway dashboard personal-knowledge gtd awareness google messaging health vault agent-orchestrator; do
              docker pull ghcr.io/arnonzamir/ll5-$img:latest 2>/dev/null || true
            done
            # Pull the selected agent variant image
            docker pull ghcr.io/arnonzamir/ll5-run-${AGENT_VARIANT}:latest 2>/dev/null || true
            # NEVER use --remove-orphans here. On 2026-05-18 a --remove-orphans run
            # destroyed 7 manually-started containers that weren't in the compose.
            # The fix was to put every service in the compose so orphans are impossible.
            # If you genuinely need to remove an unwanted container, do it explicitly
            # by name (docker rm <name>) — not via this flag.
            docker compose up -d

            # ===== Roll the running per-user agents onto the new image =====
            # (DECISION-027) `docker compose up` only touches compose services; the
            # per-user agents (ll5-agent-<uid>) are provisioned by the orchestrator
            # and keep running the OLD image until re-provisioned — provision()
            # force-pulls + force-removes by name, so this is the one path by which
            # a fresh ll5-run-claude:latest reaches a live agent. Only when this
            # run actually rebuilt run-claude; an MCP-only deploy leaves agents alone.
            if echo "$BUILT_MATRIX" | grep -q '"run-claude"'; then
              echo "run-claude rebuilt — re-provisioning running per-user agents"
              sleep 5
              docker compose exec -T agent-orchestrator node -e '
                const port = process.env.PORT || 3100;
                const r = await fetch("http://localhost:" + port + "/runtimes/reprovision-running", {
                  method: "POST",
                  headers: { authorization: "Bearer " + process.env.ORCHESTRATOR_SECRET },
                });
                const body = await r.text();
                console.log("reprovision-running:", r.status, body);
                if (!r.ok) process.exit(1);
              ' || echo "WARNING: reprovision-running failed — running agents are still on the previous image (POST /me/agent/provision to roll by hand)"
            else
              echo "run-claude not in this build — running agents untouched"
            fi

            # ===== Agent health check =====
            # The legacy shared "agent" service is gated behind the "shared-agent"
            # compose profile (retired in favor of per-user orchestrator
            # containers ll5-agent-<uid>). A normal `docker compose up -d` does NOT
            # start it, so "not running" here is EXPECTED, not an error.
            sleep 10
            AGENT_STATUS=$(docker compose ps agent --format json 2>/dev/null | jq -r '.State' 2>/dev/null || echo "absent")
            if [ "$AGENT_STATUS" = "running" ]; then
              echo "Shared agent container running (variant: $AGENT_VARIANT)"
            else
              echo "Shared agent not running (status: $AGENT_STATUS) — expected; per-user orchestrator containers serve tenants."
            fi

      - name: Health check
        run: |
          sleep 15
          for i in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://mcp-knowledge.noninoni.click/health 2>/dev/null || echo "000")
            echo "Health check attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deploy successful"
              exit 0
            fi
            sleep 10
          done
          echo "Warning: health check did not return 200, but containers may still be starting"
