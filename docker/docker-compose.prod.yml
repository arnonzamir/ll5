# LL5 Production Docker Compose for Coolify
# Coolify service UUID: xkkcc0g4o48kkcows8488so4
# Host path:            /data/coolify/services/xkkcc0g4o48kkcows8488so4/docker-compose.yml
# Repo source-of-truth: docker/docker-compose.prod.yml (kept in sync via CI diff check, post-recovery)
#
# Env vars resolved from .env at this path (and/or Coolify per-service env).
# Required: API_KEY, USER_ID, AUTH_SECRET, ENCRYPTION_KEY, POSTGRES_PASSWORD,
#           WHATSAPP_WEBHOOK_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#           EVOLUTION_API_URL, EVOLUTION_API_KEY
#
# Network strategy: single per-service network (xkkcc0g4o48kkcows8488so4).
# Traefik reaches services via that network — verified by mcp-knowledge routing
# correctly with only this network attached. No external `coolify` network needed.

networks:
  default:
    name: xkkcc0g4o48kkcows8488so4
    external: true

volumes:
  es-data:
    name: xkkcc0g4o48kkcows8488so4_es-data
    external: true
  pg-data:
    name: xkkcc0g4o48kkcows8488so4_pg-data
    external: true
  # Created by compose on first up (not pre-provisioned like es/pg).
  rabbitmq-data:
    name: xkkcc0g4o48kkcows8488so4_rabbitmq-data
  # WhatsApp session/auth state for the dedicated ll5 Evolution.
  evolution-instances:
    name: xkkcc0g4o48kkcows8488so4_evolution-instances
  # Agent persistent $HOME (shared across variants — onboarding bypass,
  # token, turn-context, posted-ledger are variant-agnostic)
  agent-home:
    name: xkkcc0g4o48kkcows8488so4_agent-home

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ---------- Infrastructure ----------

services:
  elasticsearch:
    <<: *defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch-xkkcc0g4o48kkcows8488so4
    environment:
      - discovery.type=single-node
      # Security ON (basic auth required) but no TLS — ES is internal-Docker-only
      # (no published port, no Traefik), so plaintext on the private network is
      # fine; single-node discovery exempts transport TLS. The `elastic` password
      # is bootstrapped post-deploy (reset-password) to match ELASTIC_PASSWORD,
      # which every client gets via inline creds in ELASTICSEARCH_URL.
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "1.5"
    healthcheck:
      # Authenticated now that security is on — an unauthed probe 401s, marks ES
      # "unhealthy", and gates every depends_on:service_healthy dependent. The
      # password is compose-interpolated from the on-host .env (ELASTIC_PASSWORD).
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: postgres-xkkcc0g4o48kkcows8488so4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ll5}
      POSTGRES_USER: ${POSTGRES_USER:-ll5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ll5}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ — WhatsApp ingest queue (DECISION-024). Decouples Evolution's serial
  # webhook delivery from the gateway's processing so a poison/slow message can't
  # head-of-line-block the whole feed (the 2026-07-06 outage).
  rabbitmq:
    <<: *defaults
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-xkkcc0g4o48kkcows8488so4
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ll5}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Dedicated ll5 Evolution API (WhatsApp). Own instance, reached INTERNALLY by
  # the messaging MCP + gateway at http://evolution:8080 — no public domain, no
  # cross-stack coupling. Consolidates ll5's WhatsApp onto ONE device link
  # (the multi-Evolution/multi-device sprawl on the number caused the flapping +
  # "No session found to decrypt"). DB = the `evolution` database on ll5 postgres.
  evolution:
    <<: *defaults
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-xkkcc0g4o48kkcows8488so4
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_GLOBAL_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      # No redis in the ll5 stack — use Evolution's local cache (fine for one instance).
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: "LL5"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      LOG_LEVEL: "ERROR"
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------- MCPs ----------

  personal-knowledge:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-personal-knowledge:latest
    container_name: personal-knowledge-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-knowledge.rule=Host(`mcp-knowledge.noninoni.click`)"
      - "traefik.http.routers.ll5-knowledge.tls=true"
      - "traefik.http.routers.ll5-knowledge.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-knowledge.loadbalancer.server.port=3000"

  gtd:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-gtd:latest
    container_name: gtd-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      # gtd chat tools (check_messages/send_message/list_conversations) call the
      # gateway over the internal network. Without this, env.ts falls back to
      # localhost:3006 and every chat fetch fails with "fetch failed".
      GATEWAY_URL: http://gateway:3000
      # DECISION-025: the reconcile selector (list_reconcile_work) reads awareness
      # ES for the "inbound newer than reviewed_at" check; without this the tool
      # null-degrades to an empty candidate list and the reconcile worker is a
      # no-op. Client is lazy + fully try/caught, so gtd stays up if ES is down
      # (no depends_on: elasticsearch — gtd must not couple its availability to
      # the under-provisioned ES). Same inline-cred URL every other service uses.
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-gtd.rule=Host(`mcp-gtd.noninoni.click`)"
      - "traefik.http.routers.ll5-gtd.tls=true"
      - "traefik.http.routers.ll5-gtd.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-gtd.loadbalancer.server.port=3000"

  awareness:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-awareness:latest
    container_name: awareness-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      TZ: ${TZ:-Asia/Jerusalem}
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-awareness.rule=Host(`mcp-awareness.noninoni.click`)"
      - "traefik.http.routers.ll5-awareness.tls=true"
      - "traefik.http.routers.ll5-awareness.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-awareness.loadbalancer.server.port=3000"

  google:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-google:latest
    container_name: google-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      TZ: ${TZ:-Asia/Jerusalem}
      # Calendar reads/writes are cached in ES (ll5_awareness_calendar). Without
      # this, server.ts logs "ELASTICSEARCH_URL not set — calendar reads will fall
      # back to live Google API" and the ES-backed tools return "ES not configured".
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://mcp-google.noninoni.click/oauth/callback}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-google.rule=Host(`mcp-google.noninoni.click`)"
      - "traefik.http.routers.ll5-google.tls=true"
      - "traefik.http.routers.ll5-google.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-google.loadbalancer.server.port=3000"

  messaging:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-messaging:latest
    container_name: messaging-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Dedicated in-stack Evolution (DECISION-024): reached internally, so the
      # dashboard's WhatsApp management actually works (the public URL pointed at
      # ll4's Evolution, which had no ll5 instance → every button 404'd).
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_KEY:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-messaging.rule=Host(`mcp-messaging.noninoni.click`)"
      - "traefik.http.routers.ll5-messaging.tls=true"
      - "traefik.http.routers.ll5-messaging.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-messaging.loadbalancer.server.port=3000"

  health:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-health:latest
    container_name: health-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-health.rule=Host(`mcp-health.noninoni.click`)"
      - "traefik.http.routers.ll5-health.tls=true"
      - "traefik.http.routers.ll5-health.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-health.loadbalancer.server.port=3000"

  # ---------- Gateway (orchestrator) ----------

  gateway:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-gateway:latest
    container_name: gateway-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Jerusalem}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      # WhatsApp ingest queue + self-healing webhook reconciler (DECISION-024).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ll5}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # In-stack Evolution (DECISION-024) — now internally reachable, so the
      # gateway's self-healing webhook reconciler works too.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_GLOBAL_KEY:-}
      WHATSAPP_WEBHOOK_PUBLIC_URL: ${WHATSAPP_WEBHOOK_PUBLIC_URL:-https://gateway.noninoni.click/webhook/whatsapp}
      # Base domain for mcp-*.<domain> endpoints baked into the agent .mcp.json.
      MCP_BASE_DOMAIN: ${MCP_BASE_DOMAIN:-noninoni.click}
      # Agent trigger (opencode variant only; empty = Claude Code NOTIFY flow).
      # Derived from AGENT_VARIANT in deploy script — NOT set independently.
      # This ensures single-var rollback: change AGENT_VARIANT → OPENCODE_SERVER_URL
      # auto-derives → deploy. No separate var to forget.
      #   opencode → http://agent:4096 (gateway triggers agent via HTTP POST)
      #   claude   → empty (gateway uses PG NOTIFY → channel bridge flow)
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-}
      # Opencode model selection (only used when OPENCODE_SERVER_URL is set).
      # Empty = opencode.json default; filled in by deploy from AGENT_VARIANT.
      # Default deepseek-v4-pro matches opencode.json's global default (Zen paid).
      OPENCODE_MODEL_ID: ${OPENCODE_MODEL_ID:-deepseek-v4-flash-free}
      OPENCODE_PROVIDER_ID: ${OPENCODE_PROVIDER_ID:-opencode}
      # Agent-orchestrator service (per-user container control plane). The
      # orchestrator now ships in this stack, so default the URL to its internal
      # address; empty still disables it with a clear "runtime not configured".
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://agent-orchestrator:3100}
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-}
      GOOGLE_MCP_URL: http://google:3000
      GOOGLE_MCP_API_KEY: ${API_KEY}
      WEBHOOK_TOKENS: ${WEBHOOK_TOKENS:-{}}
      GEOCODING_API_KEY: ${GEOCODING_API_KEY:-}
      FCM_SERVICE_ACCOUNT_PATH: /etc/fcm/fcm-service-account.json
      # SMTP for invite/password-reset emails (provider-agnostic: Brevo/Resend/
      # SES/any SMTP). All optional — when SMTP_HOST + SMTP_FROM are empty the
      # gateway falls back to logging the links instead of sending mail.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - /data/coolify/services/xkkcc0g4o48kkcows8488so4/fcm-service-account.json:/etc/fcm/fcm-service-account.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-gateway.rule=Host(`gateway.noninoni.click`)"
      - "traefik.http.routers.ll5-gateway.tls=true"
      - "traefik.http.routers.ll5-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-gateway.loadbalancer.server.port=3000"

  # ---------- Agent orchestrator (per-user container control plane) ----------
  # Launches/stops one opencode agent container per user via the host docker
  # socket. SECURITY: mounts /var/run/docker.sock (root-equivalent host control)
  # — only this service gets it. Per-user secrets are written to /run/ll5 (0600)
  # and bind-mounted read-only into each agent container; /run/ll5 is shared with
  # the host so the docker-socket bind resolves the same path.
  agent-orchestrator:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-agent-orchestrator:latest
    container_name: agent-orchestrator-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3100"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-}
      # Injected into each per-user env-file so the agent reaches the gateway
      # internally and MCPs via the public mcp-*.<domain> endpoints.
      LL5_GATEWAY_URL: http://gateway:3000
      MCP_BASE_DOMAIN: ${MCP_BASE_DOMAIN:-noninoni.click}
      # Per-user agent image (opencode). Anthropic variant image is optional.
      AGENT_IMAGE_OPENCODE: ghcr.io/arnonzamir/ll5-run-opencode:latest
      # Attach each per-user container to the ll5 stack network so it resolves
      # gateway/postgres/etc by hostname. Defaults to this stack's network.
      AGENT_NETWORK: ${AGENT_NETWORK:-xkkcc0g4o48kkcows8488so4}
      SECRETS_DIR: /run/ll5
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      MAX_CONTAINERS_PER_HOST: ${MAX_CONTAINERS_PER_HOST:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/ll5:/run/ll5
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ---------- Find Hub poller (Python sidecar) — DISABLED 2026-06-03 ----------
  # Disabled because the periodic Find Hub LocateTracker requests were causing
  # tracked devices/tags to RING. The poller container was stopped on the box
  # (docker stop + --restart=no) and removed from this compose so `docker compose
  # up -d` won't recreate it (deploy never uses --remove-orphans, so the stopped
  # container is a harmless orphan). To re-enable: uncomment this block, restore
  # findhub-poller in .github/workflows/build-and-push.yml (PACKAGES + pull loop),
  # and consider raising FINDHUB_POLL_INTERVAL_SEC / scoping FINDHUB_DEVICE_TYPES
  # so locate requests don't ring devices. See packages/findhub-poller/.
  #
  # findhub-poller:
  #   <<: *defaults
  #   image: ghcr.io/arnonzamir/ll5-findhub-poller:latest
  #   environment:
  #     TZ: ${TZ:-Asia/Jerusalem}
  #     LOG_LEVEL: ${LOG_LEVEL:-info}
  #     LL5_GATEWAY_WEBHOOK_URL: http://gateway:3000/webhook
  #     LL5_WEBHOOK_TOKEN: ${FINDHUB_WEBHOOK_TOKEN}
  #     FINDHUB_SECRETS_B64: ${FINDHUB_SECRETS_B64}
  #     FINDHUB_POLL_INTERVAL_SEC: ${FINDHUB_POLL_INTERVAL_SEC:-900}
  #     FINDHUB_LOCATE_TIMEOUT_SEC: ${FINDHUB_LOCATE_TIMEOUT_SEC:-30}
  #     FINDHUB_DEVICE_TYPES: ${FINDHUB_DEVICE_TYPES:-}
  #   depends_on:
  #     gateway:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.5"

  # ---------- Dashboard ----------

  dashboard:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-dashboard:latest
    container_name: dashboard-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_URL: http://gateway:3000
      NEXT_PUBLIC_GATEWAY_URL: https://gateway.noninoni.click
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-dashboard.rule=Host(`ll5.noninoni.click`)"
      - "traefik.http.routers.ll5-dashboard.tls=true"
      - "traefik.http.routers.ll5-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-dashboard.loadbalancer.server.port=3000"

  # ---------- Browser (Playwright MCP) ----------
  # Headless Chromium exposed as an MCP server so the agent can navigate, click,
  # fill forms, read rendered pages, and screenshot. The image has NO built-in
  # auth, so it's locked behind a Traefik basicAuth middleware (only the agent,
  # holding the Basic credential, can drive it). shm_size avoids Chromium
  # /dev/shm crashes. See DECISION-010.
  #
  # SSRF hardening (data plane): --blocked-origins stops the browser from loading
  # the cloud metadata IP AND the internal ll5 services — ES runs UNAUTHED on this
  # shared Docker network, so a prompt-injected page must not be able to reach
  # http://elasticsearch:9200. Residual: a raw container IP isn't enumerable here;
  # full isolation would need ES auth or a dedicated browser network.
  #
  # Persistence: chromium's --user-data-dir on a bind-mounted, pre-chowned
  # (uid 1000) host dir so cookies/logins survive restarts. (Single shared
  # profile — fine for the one-user system.)
  #
  # Shared CDP (DECISION-022): the stock image entrypoint can't run two
  # processes, so a small sh -c entrypoint (1) launches headless Chromium
  # itself with --remote-debugging-port=9222 (INTERNAL ONLY: no port publish,
  # no Traefik route — reachable solely on the Docker network) under a
  # supervise-loop, then (2) execs the Playwright MCP attached to it via
  # --cdp-endpoint. The vault MCP connects to the SAME http://browser:9222, so
  # a server-side credential fill lands in the same live session/profile the
  # agent's browser tools use. Launch-only flags (--headless/--browser/
  # --no-sandbox/--user-data-dir) moved to the chromium command; the MCP keeps
  # the transport + data-plane flags (--allowed-hosts, --blocked-origins,
  # --block-service-workers) — DECISION-010's basicAuth/allowed-hosts/
  # blocked-origins/profile constraints are unchanged.
  browser:
    <<: *defaults
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: browser-xkkcc0g4o48kkcows8488so4
    init: true
    shm_size: "1gb"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        CHROME="$$(find /ms-playwright -type f \( -name chrome -o -name headless_shell \) 2>/dev/null | head -n 1)"
        if [ -z "$$CHROME" ]; then echo "FATAL: no chromium binary under /ms-playwright" >&2; exit 1; fi
        echo "Launching shared Chromium (CDP :9222, internal-only): $$CHROME"
        ( while true; do
            "$$CHROME" --headless=new --no-sandbox --disable-gpu \
              --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 \
              --user-data-dir=/home/node/profile about:blank
            echo "chromium exited ($$?) — restarting in 2s" >&2
            sleep 2
          done ) &
        i=0
        until node -e "fetch('http://127.0.0.1:9222/json/version').then(()=>process.exit(0),()=>process.exit(1))" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then echo "WARN: CDP not up after 30s — starting MCP anyway" >&2; break; fi
          sleep 1
        done
        exec node /app/cli.js \
          --port 8931 \
          --host 0.0.0.0 \
          --allowed-hosts mcp-browser.noninoni.click \
          --cdp-endpoint http://127.0.0.1:9222 \
          --block-service-workers \
          --blocked-origins "http://169.254.169.254;https://169.254.169.254;http://elasticsearch:9200;http://gateway:3000;http://postgres:5432;http://dashboard:3000;http://awareness:3000;http://personal-knowledge:3000;http://gtd:3000;http://google:3000;http://messaging:3000;http://health:3000;http://vault:3000"
    volumes:
      - /opt/ll5/browser-profile:/home/node/profile
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    healthcheck:
      # Both the MCP port and the CDP port must be up.
      test: ["CMD-SHELL", "node -e \"const n=require('net');let ok=0;const chk=(p)=>new Promise((res,rej)=>n.connect(p,'127.0.0.1').on('connect',res).on('error',rej));chk(8931).then(()=>chk(9222)).then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-browser.rule=Host(`mcp-browser.noninoni.click`)"
      - "traefik.http.routers.ll5-browser.tls=true"
      - "traefik.http.routers.ll5-browser.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-browser.loadbalancer.server.port=8931"
      - "traefik.http.routers.ll5-browser.middlewares=ll5-browser-auth"
      # basicAuth — apr1 hash (private repo; the password lives only in the agent's
      # BROWSER_MCP_BASIC env, never in git). Rotate by regenerating both.
      - "traefik.http.middlewares.ll5-browser-auth.basicauth.users=ll5:$$apr1$$DGhX.hYN$$bO7SH7IWVNvoKvwvKkDIx/"

  # ---------- Vault MCP (DECISION-022) ----------
  # Credential vault bridge: runs the Bitwarden CLI (`bw serve`) as a localhost
  # sidecar unlocked with the machine account, and injects credentials into the
  # SHARED browser over the internal CDP endpoint. The agent never sees a
  # secret — tools return names/domains/status only. BW_* secrets are injected
  # into the on-host .env by the CI deploy job (Coolify env does not reach this
  # file — see the FINDHUB_*/ELASTIC_PASSWORD pattern in build-and-push.yml).
  vault:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-vault:latest
    container_name: vault-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      # app_log/audit rows (name-only args by design — DECISION-022 §5).
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      # Vaultwarden (separate Coolify service).
      VAULT_URL: ${VAULT_URL:-https://vault.noninoni.click}
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
      BW_PASSWORD: ${BW_PASSWORD:-}
      # Machine-account email — required (with BW_PASSWORD) for the client-side
      # Bitwarden KDF in tenant provisioning (org create / invite / confirm).
      BW_EMAIL: ${BW_EMAIL:-}
      # Shared browser CDP endpoint — internal Docker network only.
      BROWSER_CDP_URL: http://browser:9222
      GATEWAY_URL: http://gateway:3000
    depends_on:
      - browser
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      # Runtime image is node:20-slim (no wget) — probe with node's fetch.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-vault.rule=Host(`mcp-vault.noninoni.click`)"
      - "traefik.http.routers.ll5-vault.tls=true"
      - "traefik.http.routers.ll5-vault.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-vault.loadbalancer.server.port=3000"

  # ---------- Agent (variant-selectable) ----------
  agent:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-run-${AGENT_VARIANT:-claude}:latest
    container_name: agent-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jerusalem}
      API_KEY: ${API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      USER_ID: ${USER_ID}
      GATEWAY_URL: http://gateway:3000
      MCP_BASE_DOMAIN: ${MCP_BASE_DOMAIN:-noninoni.click}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      LL5_TOKEN: ${LL5_TOKEN:-}
    volumes:
      - agent-home:/data/home
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "/workspace/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - "traefik.enable=false"
