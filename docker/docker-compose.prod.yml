  # ---------- Dashboard ----------

  dashboard:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-dashboard:latest
    container_name: dashboard-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_URL: http://gateway:3000
      NEXT_PUBLIC_GATEWAY_URL: https://gateway.noninoni.click
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-dashboard.rule=Host(`ll5.noninoni.click`)"
      - "traefik.http.routers.ll5-dashboard.tls=true"
      - "traefik.http.routers.ll5-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-dashboard.loadbalancer.server.port=3000"

  # ---------- Browser (Playwright MCP) ----------
  # Headless Chromium exposed as an MCP server so the agent can navigate, click,
  # fill forms, read rendered pages, and screenshot. The image has NO built-in
  # auth, so it's locked behind a Traefik basicAuth middleware (only the agent,
  # holding the Basic credential, can drive it). shm_size avoids Chromium
  # /dev/shm crashes. See DECISION-010.
  #
  # SSRF hardening (data plane): --blocked-origins stops the browser from loading
  # the cloud metadata IP AND the internal ll5 services — ES runs UNAUTHED on this
  # shared Docker network, so a prompt-injected page must not be able to reach
  # http://elasticsearch:9200. Residual: a raw container IP isn't enumerable here;
  # full isolation would need ES auth or a dedicated browser network.
  #
  # Persistence: --user-data-dir on a bind-mounted, pre-chowned (uid 1000) host
  # dir so cookies/logins survive restarts. (Single shared profile — fine for the
  # one-user system.)
  browser:
    <<: *defaults
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: browser-xkkcc0g4o48kkcows8488so4
    init: true
    shm_size: "1gb"
    entrypoint: ["node", "/app/cli.js"]
    command:
      - "--headless"
      - "--browser"
      - "chromium"
      - "--no-sandbox"
      - "--port"
      - "8931"
      - "--host"
      - "0.0.0.0"
      # Accept the public Host header (Traefik forwards it); the MCP transport's
      # DNS-rebinding check otherwise 403s anything that isn't the bound host.
      - "--allowed-hosts"
      - "mcp-browser.noninoni.click"
      # Persistent profile (logins survive restarts).
      - "--user-data-dir"
      - "/home/node/profile"
      # SSRF hardening: block the browser from loading the metadata IP + internals.
      - "--block-service-workers"
      - "--blocked-origins"
      - "http://169.254.169.254;https://169.254.169.254;http://elasticsearch:9200;http://gateway:3000;http://postgres:5432;http://dashboard:3000;http://awareness:3000;http://personal-knowledge:3000;http://gtd:3000;http://google:3000;http://messaging:3000;http://health:3000"
    volumes:
      - /opt/ll5/browser-profile:/home/node/profile
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(8931,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-browser.rule=Host(`mcp-browser.noninoni.click`)"
      - "traefik.http.routers.ll5-browser.tls=true"
      - "traefik.http.routers.ll5-browser.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-browser.loadbalancer.server.port=8931"
      - "traefik.http.routers.ll5-browser.middlewares=ll5-browser-auth"
      # basicAuth — apr1 hash (private repo; the password lives only in the agent's
      # BROWSER_MCP_BASIC env, never in git). Rotate by regenerating both.
      - "traefik.http.middlewares.ll5-browser-auth.basicauth.users=ll5:$$apr1$$DGhX.hYN$$bO7SH7IWVNvoKvwvKkDIx/"
