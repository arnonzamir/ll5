      - "traefik.http.routers.ll5-gateway.rule=Host(`gateway.noninoni.click`)"
      - "traefik.http.routers.ll5-gateway.tls=true"
      - "traefik.http.routers.ll5-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-gateway.loadbalancer.server.port=3000"

  # ---------- Find Hub poller (Python sidecar) — DISABLED 2026-06-03 ----------
  # Disabled because the periodic Find Hub LocateTracker requests were causing
  # tracked devices/tags to RING. The poller container was stopped on the box
