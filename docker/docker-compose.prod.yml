# LL5 Production Docker Compose for Coolify
# Coolify service UUID: xkkcc0g4o48kkcows8488so4
# Host path:            /data/coolify/services/xkkcc0g4o48kkcows8488so4/docker-compose.yml
# Repo source-of-truth: docker/docker-compose.prod.yml (kept in sync via CI diff check, post-recovery)
#
# Env vars resolved from .env at this path (and/or Coolify per-service env).
# Required: API_KEY, USER_ID, AUTH_SECRET, ENCRYPTION_KEY, POSTGRES_PASSWORD,
#           WHATSAPP_WEBHOOK_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#           EVOLUTION_API_URL, EVOLUTION_API_KEY
#
# Network strategy: single per-service network (xkkcc0g4o48kkcows8488so4).
# Traefik reaches services via that network — verified by mcp-knowledge routing
# correctly with only this network attached. No external `coolify` network needed.

networks:
  default:
    name: xkkcc0g4o48kkcows8488so4
    external: true

volumes:
  es-data:
    name: xkkcc0g4o48kkcows8488so4_es-data
    external: true
  pg-data:
    name: xkkcc0g4o48kkcows8488so4_pg-data
    external: true

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ---------- Infrastructure ----------

services:
  elasticsearch:
    <<: *defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch-xkkcc0g4o48kkcows8488so4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: postgres-xkkcc0g4o48kkcows8488so4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ll5}
      POSTGRES_USER: ${POSTGRES_USER:-ll5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ll5}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MCPs ----------

  personal-knowledge:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-personal-knowledge:latest
    container_name: personal-knowledge-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-knowledge.rule=Host(`mcp-knowledge.noninoni.click`)"
      - "traefik.http.routers.ll5-knowledge.tls=true"
      - "traefik.http.routers.ll5-knowledge.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-knowledge.loadbalancer.server.port=3000"

  gtd:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-gtd:latest
    container_name: gtd-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      # gtd chat tools (check_messages/send_message/list_conversations) call the
      # gateway over the internal network. Without this, env.ts falls back to
      # localhost:3006 and every chat fetch fails with "fetch failed".
      GATEWAY_URL: http://gateway:3000
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-gtd.rule=Host(`mcp-gtd.noninoni.click`)"
      - "traefik.http.routers.ll5-gtd.tls=true"
      - "traefik.http.routers.ll5-gtd.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-gtd.loadbalancer.server.port=3000"

  awareness:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-awareness:latest
    container_name: awareness-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      TZ: ${TZ:-Asia/Jerusalem}
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-awareness.rule=Host(`mcp-awareness.noninoni.click`)"
      - "traefik.http.routers.ll5-awareness.tls=true"
      - "traefik.http.routers.ll5-awareness.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-awareness.loadbalancer.server.port=3000"

  google:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-google:latest
    container_name: google-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      # Calendar reads/writes are cached in ES (ll5_awareness_calendar). Without
      # this, server.ts logs "ELASTICSEARCH_URL not set — calendar reads will fall
      # back to live Google API" and the ES-backed tools return "ES not configured".
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://mcp-google.noninoni.click/oauth/callback}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-google.rule=Host(`mcp-google.noninoni.click`)"
      - "traefik.http.routers.ll5-google.tls=true"
      - "traefik.http.routers.ll5-google.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-google.loadbalancer.server.port=3000"

  messaging:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-messaging:latest
    container_name: messaging-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-messaging.rule=Host(`mcp-messaging.noninoni.click`)"
      - "traefik.http.routers.ll5-messaging.tls=true"
      - "traefik.http.routers.ll5-messaging.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-messaging.loadbalancer.server.port=3000"

  health:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-health:latest
    container_name: health-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY}
      USER_ID: ${USER_ID}
      AUTH_SECRET: ${AUTH_SECRET}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-health.rule=Host(`mcp-health.noninoni.click`)"
      - "traefik.http.routers.ll5-health.tls=true"
      - "traefik.http.routers.ll5-health.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-health.loadbalancer.server.port=3000"

  # ---------- Gateway (orchestrator) ----------

  gateway:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-gateway:latest
    container_name: gateway-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Jerusalem}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ll5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ll5}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      # Base domain for mcp-*.<domain> endpoints baked into the agent .mcp.json.
      MCP_BASE_DOMAIN: ${MCP_BASE_DOMAIN:-noninoni.click}
      # Agent-orchestrator service (separate). Optional — empty disables the
      # runtime-control plane with a clear "runtime not configured" error.
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-}
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-}
      GOOGLE_MCP_URL: http://google:3000
      GOOGLE_MCP_API_KEY: ${API_KEY}
      WEBHOOK_TOKENS: ${WEBHOOK_TOKENS:-{}}
      GEOCODING_API_KEY: ${GEOCODING_API_KEY:-}
      FCM_SERVICE_ACCOUNT_PATH: /etc/fcm/fcm-service-account.json
      # SMTP for invite/password-reset emails (provider-agnostic: Brevo/Resend/
      # SES/any SMTP). All optional — when SMTP_HOST + SMTP_FROM are empty the
      # gateway falls back to logging the links instead of sending mail.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - /data/coolify/services/xkkcc0g4o48kkcows8488so4/fcm-service-account.json:/etc/fcm/fcm-service-account.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-gateway.rule=Host(`gateway.noninoni.click`)"
      - "traefik.http.routers.ll5-gateway.tls=true"
      - "traefik.http.routers.ll5-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-gateway.loadbalancer.server.port=3000"

  # ---------- Find Hub poller (Python sidecar) ----------
  # Polls Google Find Hub via GoogleFindMyTools and POSTs tracked_device items
  # to the gateway over the INTERNAL network (no Cloudflare). secrets.json is
  # injected as base64 (FINDHUB_SECRETS_B64) and written at startup, since the
  # host can't be SSH'd to drop the Auth/ dir. See packages/findhub-poller/.
  findhub-poller:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-findhub-poller:latest
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LL5_GATEWAY_WEBHOOK_URL: http://gateway:3000/webhook
      LL5_WEBHOOK_TOKEN: ${FINDHUB_WEBHOOK_TOKEN}
      FINDHUB_SECRETS_B64: ${FINDHUB_SECRETS_B64}
      FINDHUB_POLL_INTERVAL_SEC: ${FINDHUB_POLL_INTERVAL_SEC:-900}
      FINDHUB_LOCATE_TIMEOUT_SEC: ${FINDHUB_LOCATE_TIMEOUT_SEC:-30}
      FINDHUB_DEVICE_TYPES: ${FINDHUB_DEVICE_TYPES:-}
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ---------- Dashboard ----------

  dashboard:
    <<: *defaults
    image: ghcr.io/arnonzamir/ll5-dashboard:latest
    container_name: dashboard-xkkcc0g4o48kkcows8488so4
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_URL: http://gateway:3000
      NEXT_PUBLIC_GATEWAY_URL: https://gateway.noninoni.click
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ll5-dashboard.rule=Host(`ll5.noninoni.click`)"
      - "traefik.http.routers.ll5-dashboard.tls=true"
      - "traefik.http.routers.ll5-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.ll5-dashboard.loadbalancer.server.port=3000"
